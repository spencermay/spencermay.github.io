# The following is the order of the links in the header of the website.
#
# Changing the order here adjusts the order of the tabs. Add a link to show a
# new tab, delete or comment out (#) a link to hide one. The `url` must match
# the `permalink` set in the corresponding page file.

main:
  - title: "Home"
    url: /

  - title: "CV"
    url: /cv/

  - title: "Hobbies"
    url: /hobbies/

